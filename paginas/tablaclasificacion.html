<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eco-Vida</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


  <link rel="stylesheet" href="../style/tablaclasificacion.css">
</head>

<body class="d-flex flex-column min-vh-100">


  <nav class="navbar-custom">

    <div class="logo">
      Eco-Vida
    </div>

    <div class="menu">
      <a href="./iniciodesesion.html">Iniciar sesión</a>
      <a href="./conocenos.html">Conócenos</a>
      <a href="./contactos.html">Contáctanos</a>
      <a href="./tablatiposR.html">Tabla de Reciclaje</a>
    </div>

  </nav>


  <div class="titulo">

    <h1>♻ Ranking de Reciclaje</h1>

    <p>
      Tabla editable para registrar materiales reciclados y participantes.
    </p>

  </div>


  <div class="tabla-container flex-fill">

    <table class="table align-middle">

      <thead>

        <tr>
          <th>Puesto</th>
          <th>Nombre</th>
          <th>Material</th>
          <th>Kilos</th>
          <th>Hora</th>
          <th>Acción</th>
        </tr>

      </thead>

      <tbody id="tabla-body">

        <tr>

          <td>
            <input type="text" value="1">
          </td>

          <td>
            <input type="text" value="Juan José">
          </td>

          <td>
            <select>
              <option>Plástico</option>
              <option>Papel</option>
              <option>Cartón</option>
            </select>
          </td>

          <td>
            <input type="text" value="120 kg">
          </td>

          <td>
            <input type="time">
          </td>

          <td>
            <button class="btn-eliminar" onclick="eliminarFila(this)">
              Eliminar
            </button>
          </td>

        </tr>

      </tbody>

    </table>


    <div class="text-center">

      <button class="btn-agregar" onclick="agregarFila()">
        + Agregar Participante
      </button>

    </div>

  </div>


  <div class="footer">

    © 2026 Eco-vida | Educación y reciclaje sostenible

  </div>


  <script>

    function agregarFila() {

      let tabla = document.getElementById("tabla-body");

      let nuevaFila = document.createElement("tr");

      nuevaFila.innerHTML = `

        <td>
          <input type="text" placeholder="#">
        </td>

        <td>
          <input type="text" placeholder="Nombre">
        </td>

        <td>
          <select>
            <option>Plástico</option>
            <option>Papel</option>
            <option>Cartón</option>
          </select>
        </td>

        <td>
          <input type="text" placeholder="0 kg">
        </td>

        <td>
          <input type="time">
        </td>

        <td>
          <button class="btn-eliminar" onclick="eliminarFila(this)">
            Eliminar
          </button>
        </td>

      `;

      tabla.appendChild(nuevaFila);
    }

    function eliminarFila(boton) {
      boton.parentElement.parentElement.remove();
    }

  </script>

</body>

</html>
