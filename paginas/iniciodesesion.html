<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <link rel="stylesheet" href="../style/iniciodesesion.css">
</head>

<body>

    
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand" href="#">
                Eco-Vida
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Contactos
                        </a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>

    
    <header class="text-center mt-5">

        <h1 class="titulo">
            Iniciar sesión
        </h1>

    </header>

    
    <section class="container mt-5 login-section" style="max-width: 420px;">

        <div class="contenedor-login">

            <form id="iniciarsesion">

                <label class="form-label text-white">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    class="form-control mb-3"
                    placeholder="Correo"
                    id="Correo"
                    required
                >

                <label class="form-label text-white">
                    Contraseña
                </label>

                <input
                    type="password"
                    class="form-control mb-3"
                    placeholder="Contraseña"
                    id="password"
                    required
                >

                <label class="form-label text-white">
                    Tipo de usuario
                </label>

                <select class="form-control mb-3" id="rol">

                    <option value="estudiante">
                        Estudiante
                    </option>

                    <option value="profesor">
                        Profesor
                    </option>

                    <option value="admin">
                        Administrador
                    </option>

                </select>

                <a href="#" class="olvide">
                    Olvidó su contraseña
                </a>

                <button type="submit"
                        class="btn boton-login w-100 mt-4">

                    Iniciar sesión

                </button>

            </form>

        </div>

    </section>

    
    <section class="container mt-5 d-none" id="panelAdmin">

        <div class="alert alert-success">

            <h2>
                Panel Administrador
            </h2>

            <p>
                Bienvenido administrador.
            </p>

            <button class="btn btn-danger" onclick="cerrarSesion()">
                Cerrar sesión
            </button>

        </div>

    </section>

    
    <section class="container mt-5 d-none" id="panelProfesor">

        <div class="alert alert-warning">

            <h2>
                Panel Profesor
            </h2>

            <p>
                Bienvenido profesor.
            </p>

            <button class="btn btn-danger" onclick="cerrarSesion()">
                Cerrar sesión
            </button>

        </div>

    </section>

    
    <section class="container mt-5 d-none" id="panelEstudiante">

        <div class="alert alert-primary">

            <h2>
                Panel Estudiante
            </h2>

            <p>
                Bienvenido estudiante.
            </p>

            <button class="btn btn-danger" onclick="cerrarSesion()">
                Cerrar sesión
            </button>

        </div>

    </section>

  
    <script src="iniciodesesion.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
